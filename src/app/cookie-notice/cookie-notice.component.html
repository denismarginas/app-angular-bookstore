@if (display && !accepted) {
<div class="cookie-notice">
  <p class="cookie-notice-text">
    We use cookies to improve your experience on this site. By continuing to browse, you agree to our use of cookies. Read our
    <a href="/page/terms-and-conditions" target="_blank" rel="noopener">Terms and Conditions</a> for more details.
  </p>
  <button type="button" class="cookie-notice-accept" (click)="accept()">Accept</button>
</div>
}
