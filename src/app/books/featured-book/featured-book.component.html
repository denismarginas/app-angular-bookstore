@if (book) {
<div class="featured-book container">
  <app-book-gallery-slider [images]="book.images" [alt]="book.title"></app-book-gallery-slider>

  <div class="featured-book-info">
    <a [routerLink]="['/books', bookLink]">
      <h2>{{ book.title }}</h2>
    </a>
    <p class="featured-book-author">{{ book.author }}</p>

    @if (book.sale_price) {
    <p class="featured-book-price">
      <span class="price-sale">${{ book.sale_price }}</span>
      <span class="price-original">${{ book.price }}</span>
    </p>
    } @else {
    <p class="featured-book-price">${{ book.price }}</p>
    }

    <button type="button" class="buy-now" [disabled]="isOutOfStock()" (click)="buyNow()">
      Buy Now
    </button>
  </div>
</div>
}
