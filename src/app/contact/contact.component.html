<app-hero title="Contact"></app-hero>

<div class="section space-y-large">
  <div class="contact container">
    @if (isSubmitted) {
    <div class="contact-success">
      <p>Thank you! Your message has been sent.</p>
    </div>
    } @else {
    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submit()">
      <app-form-field [group]="contactForm" name="subject" label="Subject"></app-form-field>

      <div class="field-row">
        <app-form-field [group]="contactForm" name="first_name" label="First Name *"></app-form-field>
        <app-form-field [group]="contactForm" name="last_name" label="Last Name *"></app-form-field>
      </div>

      <div class="field-row">
        <app-form-field [group]="contactForm" name="phone" label="Phone" type="tel"></app-form-field>
        <app-form-field [group]="contactForm" name="email" label="Email *" type="email"></app-form-field>
      </div>

      <app-form-field [group]="contactForm" name="order_id" label="Order ID"></app-form-field>
      <app-form-field [group]="contactForm" name="message" label="Message *" type="textarea"></app-form-field>

      @if (errorMessage) {
      <p class="contact-error">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send Message' }}
      </button>
    </form>
    }
  </div>
</div>
